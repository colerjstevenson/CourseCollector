name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dataset_revision:
        description: Optional Hugging Face dataset revision (branch, tag, or commit)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub

      - name: Pull dataset snapshot from Hugging Face
        env:
          HF_DATASET_ID: ${{ vars.HF_DATASET_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DATASET_ID="${HF_DATASET_ID:-colerjstevenson/GolfGulf}"
          REVISION="${{ github.event.inputs.dataset_revision }}"

          REVISION_ARGS=""
          if [ -n "${REVISION}" ]; then
            REVISION_ARGS="--revision ${REVISION}"
          fi

          python scripts/pull_hf_dataset.py \
            --dataset "${DATASET_ID}" \
            --output .hf_dataset \
            --include-csv '**/*.json,**/*.geojson,**/*.csv,manifest.json' \
            --clean \
            ${REVISION_ARGS}

      - name: Resolve dataset root for build
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .hf_dataset/golf_courses.geojson ] && [ -f .hf_dataset/cities.json ]; then
            echo "DATASET_ROOT=.hf_dataset" >> "$GITHUB_ENV"
            echo "Using prepared dataset at .hf_dataset"
            exit 0
          fi

          echo "Prepared site dataset files not found at root; building them from raw snapshot"
          python scripts/prepare_dataset.py --data-root .hf_dataset --output .hf_dataset_prepared
          echo "DATASET_ROOT=.hf_dataset_prepared" >> "$GITHUB_ENV"

      - name: Validate pulled dataset
        run: python scripts/validate_site_dataset.py --dataset-root "${DATASET_ROOT}" --min-cities 5

      - name: Build static site
        run: python scripts/build_site.py --dataset-root "${DATASET_ROOT}" --output maps

      - name: Smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -f maps/index.html
          test -f maps/world-map.html
          test -f maps/data/golf_courses.geojson
          test -f maps/data/cities.json
          test -f maps/data/landing_summary.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: maps

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
